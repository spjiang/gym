# 源站终止 TLS，绕开 ALB（微信 Cronet 对 ALB 会 RST）
# 监听 443，反代本机 backend:18000；不要开 http2。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.guanyespace.com;
    ssl_certificate     /etc/letsencrypt/live/api.guanyespace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.guanyespace.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
