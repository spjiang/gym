# 生产环境 Compose（独立文件，勿与 docker-compose.yml 叠加）
#
#   cd /home/spjiangl/gym
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 配合运维 Nginx（443）反代（监听 0.0.0.0，与开发 compose 端口一致）：
#   admin.guanyespace.com → 主机:8080
#   m.guanyespace.com     → 主机:8081
#   www.guanyespace.com   → 主机:8082
#   api.guanyespace.com   → 主机:18000
#   file.guanyespace.com  → 主机:8900（file-gateway → MinIO public；控制台仅 127.0.0.1:9001）

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gym_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gym}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gym} -d ${POSTGRES_DB:-gym}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gym}:${POSTGRES_PASSWORD:-gym_dev_password}@postgres:5432/${POSTGRES_DB:-gym}
      UPLOAD_DIR: /app/uploads
      UVICORN_RELOAD: "0"
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
    ports:
      - "18000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-gymminio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-minio-secret}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  file-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8900:80"
    volumes:
      - ./deploy/file-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  member-web:
    build:
      context: ./member-web
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

  website-web:
    build:
      context: ./website-web
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:
  minio_data:
